<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" width="1440" height="720">
  <defs>
    <!-- Base wash in the project palette: indigo-950 -> primary indigo -> sky -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1e1b4b"/>
      <stop offset="45%"  stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Translucent sheets layered to build the flowing ribbon effect -->
    <linearGradient id="sheetA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c7d2fe" stop-opacity="0.00"/>
      <stop offset="50%"  stop-color="#c7d2fe" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="sheetB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%"  stop-color="#7dd3fc" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="sheetC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e0e7ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0.00"/>
    </linearGradient>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1440" height="720" fill="url(#base)"/>

  <!-- Soft glow blooms -->
  <g filter="url(#soften)" opacity="0.75">
    <ellipse cx="1180" cy="140" rx="360" ry="220" fill="#a5b4fc" opacity="0.30"/>
    <ellipse cx="240"  cy="620" rx="380" ry="240" fill="#60a5fa" opacity="0.22"/>
  </g>

  <!-- Flowing ribbons -->
  <g filter="url(#soften)">
    <path d="M-100,470 C 220,330 430,600 760,430 C 1020,300 1220,470 1560,330 L1560,760 L-100,760 Z"
          fill="url(#sheetA)"/>
    <path d="M-100,560 C 260,430 470,690 820,520 C 1080,395 1280,560 1560,430 L1560,760 L-100,760 Z"
          fill="url(#sheetB)"/>
    <path d="M-100,300 C 240,170 400,420 720,270 C 1000,140 1200,300 1560,170 L1560,-40 L-100,-40 Z"
          fill="url(#sheetC)"/>
  </g>

  <!-- Crisp highlight edges to suggest folded sheets -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
    <path d="M-100,470 C 220,330 430,600 760,430 C 1020,300 1220,470 1560,330"/>
    <path d="M-100,560 C 260,430 470,690 820,520 C 1080,395 1280,560 1560,430"/>
    <path d="M-100,300 C 240,170 400,420 720,270 C 1000,140 1200,300 1560,170"/>
  </g>
</svg>
