<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InternBridge — AI-Powered Internship Matching</title>
    <meta
      name="description"
      content="InternBridge connects students with the right internships using explainable AI matching, skill-gap analysis and a streamlined hiring pipeline."
    />

    <!-- Inter, previously loaded via next/font/google. The `--font-sans`
         variable is preserved so `font-sans` resolves exactly as before. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
        /* Display face used for stat figures and other numeric callouts. */
        --font-display: 'Space Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif;
        /* Cursive "signature" flourish — used sparingly for brand accents. */
        --font-signature: 'Caveat', cursive;
      }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
